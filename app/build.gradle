plugins { id 'com.android.application' }
android {
    namespace 'pro.aanba.tv'
    compileSdk 35
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    defaultConfig {
        applicationId 'pro.aanba.tv'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.4.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            def location = System.getenv('AANBA_KEYSTORE')
            if (location) {
                storeFile file(location)
                storePassword System.getenv('AANBA_STORE_PASSWORD')
                keyAlias System.getenv('AANBA_KEY_ALIAS')
                keyPassword System.getenv('AANBA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { buildConfigField 'boolean', 'QA_ENABLED', 'true' }
        release { if (System.getenv('AANBA_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled false; buildConfigField 'boolean', 'QA_ENABLED', 'false' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; disable 'OldTargetApi' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'junit:junit:4.13.2'
}
